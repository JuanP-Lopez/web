<div
  class="flex flex-col w-full p-4 gap-4 bg-[var(--color-surface)] rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)] border-b-4 border-[var(--karina-accent)]"
>
  <div class="flex flex-row items-center gap-[1rem]">
    <img
      src="{{ review().picUrl }}"
      alt=""
      class="rounded-full size-[4em] border-3 border-[var(--karina-accent)]"
    />
    <span class="font-bold text-[1rem]">{{ review().name }}</span>
  </div>

  <span class="text-pretty">
    {{ review().text }}
  </span>

  <div class="flex flex-row mb-6">
    @for (stars of ratingScale; track stars) {
      <svg
        lucideStar
        class="size-5"
        [class]="stars <= review().rating ? `text-[var(--karina-accent)]` : `text-[var(--text-muted)]`"
      ></svg>
    }
  </div>
</div>

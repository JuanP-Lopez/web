<div class="chat-input flex w-full border-t-2 border-t-[var(--karina-accent)] rounded-t-[var(--radius-md)] items-center">

    <div class="flex flex-col w-full p-1">

        <form (submit)="onSubmit($event)" class="flex flex-row m-4 justify-between">
            
            <input type="text" name="message" id="message"
            [formControl]="messageControl"
            placeholder="Escribe un mensaje"
            class="input border-2 border-[var(--karina-accent)] rounded-[var(--radius-md)] rounded-br-none bg-[var(--linen)]
            flex p-2 focus:border-[var(--karina)] focus:outline-none">

            <button 
            type="submit" [disabled]="messageControl.invalid"
            class="input-button  flex items-center justify-center bg-[var(--linen)]
            border-2 border-[var(--karina-accent)] rounded-full shadow-[var(--shadow-md)]
            hover:scale-105 hover:rotate-12 transition">
                <svg lucideSend class="icon text-[var(--karina-accent)]"></svg>
            </button>

        </form>

    </div>

</div>

<div class="flex bg-[var(--color-surface)] h-auto flex-col m-2 p-8 rounded-[var(--radius-md)] 
shadow-[var(--shadow-md)]">
    
    <form action="" class="flex flex-col gap-1">

        <label for="nickname" class="font-bold">Apodo</label>
        <input type="text" name="nickname" id="nickname" 
        class="border-2 border-[var(--karina-accent)] rounded-[var(--radius-md)] h-15
        flex p-2 focus:border-[var(--karina)] focus:outline-none">

        <label for="tone" class="font-bold">Tono</label>
        <input type="text" name="tone" id="tone" 
        class="border-2 border-[var(--karina-accent)] rounded-[var(--radius-md)] h-15
        flex p-2 focus:border-[var(--karina)] focus:outline-none">

        <label for="language" class="font-bold">Lenguaje</label>
        <input type="text" name="language" id="language" 
        class="border-2 border-[var(--karina-accent)] rounded-[var(--radius-md)] h-15
        flex p-2 focus:border-[var(--karina)] focus:outline-none">

        <div class="flex justify-center">

            <button class="flex m-4 justify-center p-4 bg-[var(--karina-accent)] font-bold 
            text-[var(--linen)] rounded-[var(--radius-full)] shadow-[var(--shadow-sm)]">
                Guardar preferencias
            </button>

        </div>

    </form>
    
</div>
